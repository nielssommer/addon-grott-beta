---
name: Grott Beta branch (3.0)
version: 0.2.4
slug: grott-beta
description: The Growatt inverter monitor with the current Home Assistant plugin integrated
url: https://github.com/nielssommer/addon-grott-beta
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
services:
  - mqtt:need
init: false
map:
  - addon_config:rw
ports:
  5279/tcp: 5279
  5781/tcp: 5781
  5782/tcp: 5782
ports_description:
  5279/tcp: The port used by Grott in proxy mode
  5781/tcp: The Grottserver TCP port for the Growatt data logger and inverter commands
  5782/tcp: The Grottserver HTTP API port for inverter control
options:
  data_path: /config/grott
  gmode: server
  ggrottport: 5781
  ghttpport: 5782
  gserverpassthrough: true
  grott_mqtt: false
  ginvtype: default
  ginvtypemap: ""
  retain: false
  verbose: false
  ha_plugin: true
  mqtt: {}
schema:
  gblockcmd: bool?
  gcompat: bool?
  gdecrypt: bool?
  gextension: bool?
  gextname: str?
  gextvar: str?
  ggrottip: str?
  ggrottport: port?
  ggrowattip: str?
  ggrowattport: port?
  gifbucket: str?
  gifdbname: str?
  gifip: str?
  giforg: str?
  gifpassword: password?
  gifport: port?
  giftoken: str?
  gifuser: str?
  gincludeall: bool?
  ginflux: bool?
  ginflux2: bool?
  ginverterid: str?
  ginvtype: str?
  ginvtypemap: str?
  gminrecl: int?
  gmode: str
  gserverpassthrough: bool?
  ghttpport: port?
  gmqttauth: bool?
  gmqttinverterintopic: bool?
  gmqttip: str?
  gmqttpassword: password?
  gmqttport: str?
  gmqtttopic: str?
  gmqttuser: str?
  gnoipf: bool?
  grott_mqtt: bool?
  gpvapikey: str?
  gpvdisv1: bool?
  gpvinverters: int?
  gpvoutput: bool?
  gpvsystemid: int?
  gpvtemp: bool?
  gsendbuf: bool?
  gtime: str?
  gtimezone: str?
  gvalueoffset: int?
  verbose: bool
  retain: bool
  ha_plugin: bool
  mqtt:
    host: str?
    port: int?
    user: str?
    password: str?
  data_path: str
